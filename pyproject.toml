[project]
name = "lost-in-transcription"
version = "0.1.0"
description = "Code-switched ASR for the Mozilla Data Collective 'Lost in Transcription' competition"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",              # LoRA fine-tuning
    "evaluate>=0.4",
    "jiwer>=3.0",             # WER
    "librosa>=0.10",
    "soundfile>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pyctcdecode>=0.5",       # beam search + KenLM decoding for CTC models
]

[project.optional-dependencies]
# KenLM often needs a build step / conda; keep separate so core install stays clean.
lm = ["kenlm>=0.2"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lit"]

[tool.ruff]
line-length = 100
target-version = "py311"
